[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plagai"
version = "0.1.0"
description = "AI-generated text and plagiarism detection, served as a credit-metered API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "torch>=2.3",
  "transformers>=4.45",
  "datasets>=3.0",
  "accelerate>=0.33",
  "sentence-transformers>=3.0",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "sentencepiece>=0.2",
  "protobuf>=4.25",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "pydantic[email]>=2.6",
  "httpx>=0.27",
  "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
faiss = ["faiss-cpu>=1.8"]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
plagai = "plagai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
